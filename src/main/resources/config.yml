block-type: "NOTE_BLOCK"
block-name: "&aBlok Działki"
block-lore:
  - " &8▶ &7ᴘᴏsᴛᴀᴡ ᴀʙʏ ᴢᴀᴊᴀᴄ ᴅᴀɴʏ ᴏʙsᴢᴀʀ"

hologram-lines:
  - "&e&lᴅᴢɪᴀʟᴋᴀ"
  - "&7ᴡʟᴀsᴄɪᴄɪᴇʟ: {owner}"
  - "&7ᴡɪᴇʟᴋᴏsᴄ: &b{size}x{size}"
  - "&7ᴄᴢʟᴏɴᴋᴏᴡɪᴇ: &b{players}"
  - "&8sᴛᴡᴏʀᴢᴏɴᴏ: {created_at}"

economy:
  size-upgrade-multiplier: 2500.0
  member-upgrade-multiplier: 5000.0

# MAKSYMALNE POZIOMY ULEPSZEŃ
upgrades:
  max-size-level: 5       # Maksymalny poziom wielkości (Poziom 5 = 16 + 5*4 = 36x36)
  max-member-level: 4     # Maksymalny poziom limitu członków (Poziom 4 = 2 + 4*2 = 10 członków)

# ===================================================
#     INTEGRACJA ZE STORMANTYLOGOUT (ochrona walki)
# ===================================================
# Jeśli gracz jest w trakcie walki PvP (stan "antylogout" wg pluginu STORMANTYLOGOUT)
# i spróbuje wbiec na cudzą działkę (na której nie jest właścicielem/członkiem), zostanie
# cofnięty, a przed nim postawiona zostanie fałszywa (widoczna tylko dla niego) ściana ze
# szkła blokująca dalsze wejście - dokładnie tak jak robi to Storm na swoich regionach.
# Wymaga zainstalowanego i włączonego pluginu STORMANTYLOGOUT - jeśli go nie ma na serwerze,
# ta sekcja jest po prostu ignorowana (integracja się nie włączy, reszta pluginu działa normalnie).
combat-protection:
  enabled: true
  glass-wall:
    material: "GLASS"
    size: 5                  # bok kwadratu ściany (bloki)
    duration-seconds: 10     # po ilu sekundach ściana zniknie sama, jeśli gracz przestanie próbować wejść

