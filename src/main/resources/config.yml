# ===================================================
#             GETDZIALKI - CONFIGURATION
# ===================================================

block-type: "NOTE_BLOCK"
block-name: "&aBlok Działki"
block-lore:
  - " &8▶ &7ᴘᴏsᴛᴀᴡ ᴀʙʏ ᴢᴀᴊᴀᴄ ᴅᴀɴʏ ᴏʙsᴢᴀʀ"

hologram-lines:
  - "&e&lᴅᴢɪᴀʟᴋᴀ"
  - "&7ᴡʟᴀsᴄɪᴄɪᴇʟ: {owner}"
  - "&7ᴡɪᴇʟᴋᴏsᴄ: &b{size}x{size}"
  - "&7ᴄᴢʟᴏɴᴋᴏᴡɪᴇ: &b{players}"
  - "&8sᴛᴡᴏʀᴢᴏɴᴏ: {created_at}"

economy:
  size-upgrade-multiplier: 2500.0
  member-upgrade-multiplier: 5000.0

# ===================================================
#   WALKA (COMBAT-TAG) I ŚCIANA ZE SZKŁA
#   Integracja ze StormAntyLogout - jeśli ten plugin jest zainstalowany,
#   status walki jest sprawdzany również z jego systemu combat-tag.
#   Jeśli go nie ma, getDzialki korzysta z własnego (poniżej).
# ===================================================
combat:
  enabled: true
  # Czas (w sekundach) na jaki własny (zapasowy) system combat-tag oznacza
  # graczy jako "w walce" po trafieniu PvP - używany tylko gdy StormAntyLogout
  # nie jest zainstalowany na serwerze.
  self-duration: 15

  glass-wall:
    # Rozmiar ściany ze szkła (5 = 5x5)
    size: 5
    # Materiał z jakiego zbudowana jest ściana
    material: "GLASS"
    # Maksymalny czas (w sekundach) po jakim ściana zniknie sama,
    # nawet jeśli walka jeszcze trwa (bezpiecznik)
    duration: 8

# ===================================================
#             RANGI CZŁONKÓW DZIAŁKI
# ===================================================
ranks:
  # Domyślna ranga nadawana nowo dodanemu członkowi
  default: "CZLONEK"
  names:
    CZLONEK: "&7Członek"
    MENADZER: "&6Menadżer"

# MAKSYMALNE POZIOMY ULEPSZEŃ
upgrades:
  max-size-level: 5       # Maksymalny poziom wielkości (Poziom 5 = 16 + 5*4 = 36x36)
  max-member-level: 4     # Maksymalny poziom limitu członków (Poziom 4 = 2 + 4*2 = 10 członków)

