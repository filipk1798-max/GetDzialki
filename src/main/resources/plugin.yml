name: getDzialki
version: '2.0'
main: pl.bananek355.getDzialki.GetDzialkiPlugin
api-version: '1.20'
author: bananek355
description: Plugin działek z panelem, rangami członków (Menadżer/Członek) i integracją ze STORMANTYLOGOUT

# WAŻNE: softdepend (nie depend!) - dzięki temu getDzialki działa normalnie nawet jeśli
# STORMANTYLOGOUT nie jest zainstalowany (integracja combat-glasswall po prostu się nie włączy).
# Jeśli JEST zainstalowany, wpisanie go tutaj gwarantuje że załaduje się PRZED getDzialki,
# więc StormAntiLogout.getInstance() nigdy nie będzie null w momencie startu naszego pluginu.
softdepend: [STORMANTYLOGOUT, Vault, WorldGuard]

commands:
  dzialka:
    description: Główna komenda pluginu getDzialki
    usage: /dzialka <home|crafting|ulepsz|ustawienia|dostep|pomoc>
  getdzialka:
    description: Komendy administracyjne getDzialki
    usage: /getdzialka <reload|killholograms|teleportuj>
    permission: getdzialki.admin

permissions:
  getdzialki.admin:
    description: Pełny dostęp administracyjny do wszystkich działek i komend admina
    default: op
